<textarea id="proposalOutput" class="output-box" readonly placeholder="Your generated proposal will appear here..."></textarea>
    </div>

</div>

<script>
    document.getElementById('proposalForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const payload = {
            client_name: document.getElementById('clientName').value,
            service_type: document.getElementById('serviceType').value,
            amount_cad: parseFloat(document.getElementById('amountCad').value)
        };

        try {
            const res = await fetch('/api/generate-proposal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                const data = await res.json();
                document.getElementById('proposalOutput').value = data.proposal_text;
            } else {
                alert('Error generating proposal');
            }
        } catch (err) {
            alert('Server connection error');
        }
    });

    document.getElementById('copyBtn').addEventListener('click', function() {
        const textarea = document.getElementById('proposalOutput');
        if (textarea.value) {
            navigator.clipboard.writeText(textarea.value);
            alert('Copied to clipboard!');
        }
    });
</script>
