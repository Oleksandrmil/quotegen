<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuoteGen Canada — Fast B2B Proposals</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4">
<div class="max-w-lg w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6
shadow-2xl">
<h1 class="text-xl font-bold text-emerald-400 mb-4">QuoteGen.ca</h1>
<div class="space-y-3">
<input id="client" type="text" placeholder="Client Name" class="w-full bg-
zinc-950 border border-zinc-800 rounded p-2 text-sm">
<input id="service" type="text" placeholder="Service Type" class="w-full bg-
zinc-950 border border-zinc-800 rounded p-2 text-sm">
<input id="amount" type="number" placeholder="Amount CAD" class="w-full bg-
zinc-950 border border-zinc-800 rounded p-2 text-sm">
<button onclick="generateQuote()" class="w-full bg-emerald-600 hover:bg-
emerald-500 text-white font-bold py-2 rounded">Generate Proposal</button>
</div>
<div id="out" class="mt-4 p-3 bg-zinc-950 border border-zinc-800 rounded hidden
font-mono text-xs text-zinc-300 whitespace-pre-line"></div>
</div> <script>
async function generateQuote() {
const res = await fetch('/api/generate-proposal', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({
client_name: document.getElementById('client').value,
service_type: document.getElementById('service').value,
amount_cad: parseFloat(document.getElementById('amount').value)
})
});
const data = await res.json();
if(data.status==='success') {
document.getElementById('out').innerText = data.result;
document.getElementById('out').classList.remove('hidden');
}
}
</script>
</body>
</html>
