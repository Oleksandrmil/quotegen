5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition">Copy Text</button>
            </div>
        </div>

        <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-6 relative flex flex-col">
            <textarea id="proposalOutput" readonly placeholder="Your generated proposal text will appear here in high-contrast formatted text..." class="w-full h-full bg-transparent text-slate-200 text-sm font-mono leading-relaxed resize-none focus:outline-none placeholder-slate-600"></textarea>
        </div>
    </section>
</main>

<script>
    document.getElementById('proposalForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const payload = {
            client_name: document.getElementById('clientName').value,
            service_type: document.getElementById('serviceType').value,
            amount_cad: parseFloat(document.getElementById('amountCad').value)
        };

        try {
            const res = await fetch('/api/generate-proposal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                const data = await res.json();
                document.getElementById('proposalOutput').value = data.proposal_text;
            } else {
                alert('Error generating proposal');
            }
        } catch (err) {
            alert('Connection error');
        }
    });

    document.getElementById('copyBtn').addEventListener('click', function() {
        const textarea = document.getElementById('proposalOutput');
        if (textarea.value) {
            navigator.clipboard.writeText(textarea.value);
            alert('Proposal copied to clipboard!');
        }
    });
</script>
